<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>設備管理手順書システム</title>

  <!-- PWA & Mobile Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a84ff">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192.png?text=手順書">

  <!-- JSQR Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    :root {
      --primary: #0a84ff;
      --primary-dark: #0066cc;
      --danger: #ff453a;
      --success: #30d158;
      --warning: #ff9f0a;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --border: #d1d1d6;
    }

    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
    
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 1.8rem; margin: 0; font-weight: 700; letter-spacing: -0.5px; }

    /* トースト通知 */
    #status-toast {
      display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; border-radius: 14px; font-weight: 600; color: white;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18); z-index: 2000; text-align: center; max-width: 90%;
    }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }

    /* メインメニュー Grid (洗練されたアイコンUI) */
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 800px; margin: 0 auto; }
    .btn-main {
      background: var(--card-bg); border: 1px solid rgba(0,0,0,0.08); border-radius: 20px;
      padding: 32px 20px; font-size: 1.2rem; font-weight: 700; color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.04); position: relative;
      transition: transform 0.1s ease;
    }
    .btn-main:active { transform: scale(0.98); }
    .svg-icon { width: 48px; height: 48px; fill: var(--primary); }

    /* 未同期時の強調表示 */
    .btn-main.highlight {
      border: 2px solid var(--danger); background: #fff5f5;
      animation: pulse 1.5s infinite;
    }
    .btn-main.highlight .svg-icon { fill: var(--danger); }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 69, 58, 0.4); }
      70% { box-shadow: 0 0 0 16px rgba(255, 69, 58, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 69, 58, 0); }
    }
    .badge {
      position: absolute; top: 14px; right: 14px; background: var(--danger);
      color: white; border-radius: 20px; padding: 4px 12px; font-size: 0.85rem; font-weight: 700;
    }

    /* パネル共通 */
    .panel { display: none; background: var(--card-bg); border-radius: 20px; padding: 28px; max-width: 800px; margin: 20px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .panel-header h2 { margin: 0; font-size: 1.5rem; }

    input[type="text"], textarea {
      width: 100%; padding: 14px 16px; margin-bottom: 16px; border: 1px solid var(--border);
      border-radius: 12px; font-size: 1rem; background: #fafafa; color: var(--text);
    }

    /* ステップ（手順）ブロック */
    .step-block {
      background: #f8f9fa; border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; margin-bottom: 24px; position: relative;
    }
    .step-header { font-size: 1.2rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    /* 大型化された写真入力コントロール */
    .photo-control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .btn-photo-large {
      background: #eef6ff; border: 2px dashed var(--primary); border-radius: 14px;
      padding: 20px 12px; text-align: center; color: var(--primary); font-size: 1.1rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-photo-large input[type="file"] { display: none; }

    /* 描画キャンバス領域 */
    .canvas-container { position: relative; margin-top: 12px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #2c2c2e; text-align: center; }
    canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; background: #000; touch-action: none; }
    .canvas-tools { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .tool-btn { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-weight: 600; cursor: pointer; }
    .tool-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* 追加・アクションボタン */
    .btn-add-step {
      width: 100%; padding: 18px; background: #eef6ff; border: 2px dashed var(--primary);
      border-radius: 14px; color: var(--primary); font-size: 1.1rem; font-weight: 700;
      cursor: pointer; margin-bottom: 24px; text-align: center;
    }
    .action-btns { display: flex; gap: 12px; margin-top: 24px; }
    .btn-action { flex: 1; padding: 16px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 700; color: white; cursor: pointer; }
    .btn-save { background: var(--warning); }
    .btn-submit { background: var(--success); }
    .btn-cancel { background: #8e8e93; }

    /* A4縦手順書レイアウト (閲覧用) */
    .a4-container {
      background: white; border: 1px solid var(--border); border-radius: 8px;
      padding: 40px; width: 100%; max-width: 700px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }
    .a4-title { font-size: 1.8rem; font-weight: 800; border-bottom: 3px solid var(--primary); padding-bottom: 12px; margin-bottom: 20px; }
    .a4-meta { font-size: 0.95rem; color: #666; margin-bottom: 30px; }
    .a4-step { margin-bottom: 32px; border-bottom: 1px solid #eee; padding-bottom: 24px; }
    .a4-step-num { font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
    .a4-step-text { font-size: 1.05rem; line-height: 1.6; white-space: pre-wrap; margin-bottom: 16px; }
    .a4-step-img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #ddd; display: block; margin: 0 auto; }

    /* カメラ映像枠 */
    #qr-video { width: 100%; height: 320px; object-fit: cover; border-radius: 14px; background: #000; }
  </style>
</head>
<body>

  <header>
    <h1>設備管理 作業手順書</h1>
    <div id="storage-alert" style="display:none; color: var(--danger); font-weight: bold; margin-top: 8px;">
      ⚠️ 端末ストレージの空き容量がわずかです
    </div>
  </header>

  <div id="status-toast"></div>

  <!-- メインメニュー (4ボタン SVGアイコン化) -->
  <main class="menu-grid" id="home-menu">
    <button class="btn-main" onclick="openQRScanner()">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm13-2h3v2h-3zm-3 3h2v3h-2zm3 3h3v3h-3zm-3-3h2v-3h-2zm3-3h3v2h-3z"/></svg>
      QRコード読み取り
    </button>
    <button class="btn-main" onclick="openPanel('search-panel')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      手順書を探す・閲覧
    </button>
    <button class="btn-main" onclick="openPanel('create-panel')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      手順書を作る・編集
    </button>
    <button id="sync-btn" class="btn-main" onclick="syncWithServer()">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
      承認待ち・同期
      <span id="sync-badge" class="badge" style="display:none;">0</span>
    </button>
  </main>

  <!-- 1. QRスキャナー -->
  <section id="qr-panel" class="panel">
    <div class="panel-header">
      <h2>機器QRコード読み取り</h2>
      <button class="tool-btn" onclick="closePanel()">閉じる</button>
    </div>
    <video id="qr-video" playsinline></video>
    <p style="text-align: center; color: #666; margin-top: 12px;">機器に貼られたQRコードをカメラにかざしてください</p>
  </section>

  <!-- 2. 全文検索 -->
  <section id="search-panel" class="panel">
    <div class="panel-header">
      <h2>手順書検索</h2>
      <button class="tool-btn" onclick="closePanel()">閉じる</button>
    </div>
    <input type="text" id="search-input" placeholder="検索ワードを入力（タイトル・手順内容対象）..." oninput="executeSearch()">
    <div id="search-results"></div>
  </section>

  <!-- 3. 手順書 作成・編集 (動的ステップ構成) -->
  <section id="create-panel" class="panel">
    <div class="panel-header">
      <h2>手順書の作成・編集</h2>
      <button class="tool-btn" onclick="closePanel()">閉じる</button>
    </div>
    
    <label><b>手順書タイトル</b></label>
    <input type="text" id="doc-title" placeholder="例：ターボ冷凍機 起動点検手順">
    
    <label><b>設備ID（QRコード紐付け用）</b></label>
    <input type="text" id="doc-equip" placeholder="例：PUMP-A01">

    <!-- 動的に手順ステップが追加されるコンテナ -->
    <div id="steps-container"></div>

    <button type="button" class="btn-add-step" onclick="addStepBlock()">＋ 手順ステップを追加</button>

    <div class="action-btns">
      <button class="btn-action btn-cancel" onclick="closePanel()">キャンセル</button>
      <button class="btn-action btn-save" onclick="saveProcedure('draft')">一時保存</button>
      <button class="btn-action btn-submit" onclick="saveProcedure('pending')">完了（承認申請）</button>
    </div>
  </section>

  <!-- 4. 詳細閲覧 (A4縦レイアウト表示) -->
  <section id="view-panel" class="panel" style="background: transparent; box-shadow: none;">
    <div style="text-align: right; margin-bottom: 12px;">
      <button class="tool-btn" onclick="closePanel()">閉じる</button>
    </div>
    <div class="a4-container">
      <div class="a4-title" id="view-title"></div>
      <div class="a4-meta"><b>設備ID:</b> <span id="view-equip"></span></div>
      <div id="view-steps-body"></div>
    </div>
  </section>

  <script>
    /* 1. IndexedDB データベース管理 */
    let db;
    const dbRequest = indexedDB.open("LocalProcedureDB_v2", 1);

    dbRequest.onupgradeneeded = (e) => {
      db = e.target.result;
      const store = db.createObjectStore("procedures", { keyPath: "id", autoIncrement: true });
      store.createIndex("equipId", "equipId", { unique: false });
      store.createIndex("status", "status", { unique: false });
    };

    dbRequest.onsuccess = (e) => {
      db = e.target.result;
      updateSyncStatusUI();
      checkStorageQuota();
    };

    /* 2. UI切り替え・通知 */
    function openPanel(panelId) {
      document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
      document.getElementById('home-menu').style.display = 'none';
      document.getElementById(panelId).style.display = 'block';
      if (panelId === 'search-panel') executeSearch();
      if (panelId === 'create-panel' && stepCount === 0) addStepBlock();
    }

    function closePanel() {
      document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
      document.getElementById('home-menu').style.display = 'grid';
      stopQRScanner();
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('status-toast');
      toast.textContent = message;
      toast.className = `toast-${type}`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    /* 3. 手順ステップ追加・大型写真ボタン・高精度Canvas描画 */
    let stepCount = 0;
    const stepCanvases = {};

    function addStepBlock() {
      stepCount++;
      const stepId = stepCount;
      const container = document.getElementById('steps-container');

      const block = document.createElement('div');
      block.className = 'step-block';
      block.id = `step-block-${stepId}`;
      block.innerHTML = `
        <div class="step-header">
          <span>手順 ${stepId}</span>
          ${stepId > 1 ? `<button type="button" class="tool-btn" style="color:var(--danger);" onclick="removeStepBlock(${stepId})">削除</button>` : ''}
        </div>
        <textarea class="step-desc" rows="3" placeholder="手順${stepId}の説明文を入力..."></textarea>
        
        <div class="photo-control-grid">
          <label class="btn-photo-large">
            📷 撮影する
            <input type="file" accept="image/*" capture="environment" onchange="handleStepPhoto(event, ${stepId})">
          </label>
          <label class="btn-photo-large">
            🖼 フォルダ選択
            <input type="file" accept="image/*" onchange="handleStepPhoto(event, ${stepId})">
          </label>
        </div>

        <div class="canvas-tools" id="tools-${stepId}" style="display:none;">
          <button type="button" class="tool-btn active" onclick="setStepTool(${stepId}, 'pen', this)">🖊 手書き</button>
          <button type="button" class="tool-btn" onclick="setStepTool(${stepId}, 'arrow', this)">↗ 矢印</button>
          <button type="button" class="tool-btn" onclick="setStepTool(${stepId}, 'circle', this)">⭕ 丸印</button>
          <button type="button" class="tool-btn" onclick="clearStepCanvas(${stepId})">🗑 リセット</button>
        </div>

        <div class="canvas-container" id="canvas-wrap-${stepId}" style="display:none;">
          <canvas id="canvas-${stepId}"></canvas>
        </div>
      `;
      container.appendChild(block);
    }

    function removeStepBlock(stepId) {
      document.getElementById(`step-block-${stepId}`).remove();
      delete stepCanvases[stepId];
    }

    /* 写真取り込みと縦横比保持描画 */
    function handleStepPhoto(e, stepId) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          document.getElementById(`tools-${stepId}`).style.display = 'flex';
          document.getElementById(`canvas-wrap-${stepId}`).style.display = 'block';

          const cvs = document.getElementById(`canvas-${stepId}`);
          const ctx = cvs.getContext('2d');

          // 写真の元の縦横比（アスペクト比）を完全に維持
          const maxW = 700;
          const scale = Math.min(1, maxW / img.width);
          cvs.width = img.width * scale;
          cvs.height = img.height * scale;

          ctx.drawImage(img, 0, 0, cvs.width, cvs.height);

          stepCanvases[stepId] = {
            canvas: cvs, ctx: ctx, baseImg: img,
            currentTool: 'pen', isDrawing: false,
            startX: 0, startY: 0, snapshot: null
          };

          initStepCanvasEvents(stepId);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setStepTool(stepId, tool, btn) {
      if (stepCanvases[stepId]) {
        stepCanvases[stepId].currentTool = tool;
        document.querySelectorAll(`#tools-${stepId} .tool-btn`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    }

    function clearStepCanvas(stepId) {
      const item = stepCanvases[stepId];
      if (!item) return;
      item.ctx.clearRect(0, 0, item.canvas.width, item.canvas.height);
      item.ctx.drawImage(item.baseImg, 0, 0, item.canvas.width, item.canvas.height);
    }

    /* 描画の極小移動・丸印・矢印の高精度化イベント */
    function initStepCanvasEvents(stepId) {
      const item = stepCanvases[stepId];
      const cvs = item.canvas;
      const ctx = item.ctx;

      const getPos = (e) => {
        const rect = cvs.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (cvs.width / rect.width),
          y: (clientY - rect.top) * (cvs.height / rect.height)
        };
      };

      const startDraw = (e) => {
        item.isDrawing = true;
        const pos = getPos(e);
        item.startX = pos.x;
        item.startY = pos.y;
        item.snapshot = ctx.getImageData(0, 0, cvs.width, cvs.height);

        ctx.strokeStyle = '#ff3b30';
        ctx.fillStyle = '#ff3b30';
        ctx.lineWidth = Math.max(4, cvs.width / 120);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (item.currentTool === 'pen') {
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
        }
      };

      const moveDraw = (e) => {
        if (!item.isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);

        if (item.currentTool === 'pen') {
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        } else {
          ctx.putImageData(item.snapshot, 0, 0); // 前のフレームを復元
          if (item.currentTool === 'circle') {
            const r = Math.sqrt(Math.pow(pos.x - item.startX, 2) + Math.pow(pos.y - item.startY, 2));
            ctx.beginPath();
            ctx.arc(item.startX, item.startY, r, 0, 2 * Math.PI);
            ctx.stroke();
          } else if (item.currentTool === 'arrow') {
            drawArrow(ctx, item.startX, item.startY, pos.x, pos.y);
          }
        }
      };

      const stopDraw = () => { item.isDrawing = false; };

      cvs.onpointerdown = startDraw;
      cvs.onpointermove = moveDraw;
      cvs.onpointerup = stopDraw;
    }

    function drawArrow(ctx, fromX, fromY, toX, toY) {
      const headlen = Math.max(16, ctx.lineWidth * 3);
      const angle = Math.atan2(toY - fromY, toX - fromX);
      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
      ctx.fill();
    }

    /* 4. 手順書の保存 */
    function saveProcedure(statusType) {
      const title = document.getElementById('doc-title').value.trim();
      const equipId = document.getElementById('doc-equip').value.trim();

      if (!title) return alert("タイトルを入力してください");

      const stepsData = [];
      document.querySelectorAll('.step-block').forEach((block, index) => {
        const stepNum = index + 1;
        const desc = block.querySelector('.step-desc').value;
        let imgData = null;

        const cvs = block.querySelector('canvas');
        if (cvs && cvs.width > 0 && block.querySelector('.canvas-container').style.display !== 'none') {
          imgData = cvs.toDataURL('image/png');
        }

        stepsData.push({ stepNum, desc, imgData });
      });

      const tx = db.transaction(["procedures"], "readwrite");
      const store = tx.objectStore("procedures");

      store.add({
        title, equipId, steps: stepsData,
        status: statusType,
        updatedAt: new Date().toISOString()
      });

      tx.oncomplete = () => {
        showToast(statusType === 'draft' ? "一時保存しました" : "作成完了（承認申請）しました");
        resetForm();
        closePanel();
        updateSyncStatusUI();
      };
    }

    function resetForm() {
      document.getElementById('doc-title').value = '';
      document.getElementById('doc-equip').value = '';
      document.getElementById('steps-container').innerHTML = '';
      stepCount = 0;
      for (let key in stepCanvases) delete stepCanvases[key];
    }

    /* 5. 同期機能 & 検索 & A4縦表示 */
    function updateSyncStatusUI() {
      if (!db) return;
      const tx = db.transaction(["procedures"], "readonly");
      const store = tx.objectStore("procedures");
      const req = store.getAll();

      req.onsuccess = () => {
        const pendingItems = req.result.filter(item => item.status === 'pending');
        const syncBtn = document.getElementById('sync-btn');
        const badge = document.getElementById('sync-badge');

        if (pendingItems.length > 0) {
          syncBtn.classList.add('highlight');
          badge.style.display = 'block';
          badge.textContent = `${pendingItems.length}件`;
        } else {
          syncBtn.classList.remove('highlight');
          badge.style.display = 'none';
        }
      };
    }

    async function syncWithServer() {
      showToast("同期処理中...", "success");
      try {
        const tx = db.transaction(["procedures"], "readwrite");
        const store = tx.objectStore("procedures");
        const req = store.getAll();
        req.onsuccess = () => {
          req.result.forEach(item => {
            if (item.status === 'pending') {
              item.status = 'approved';
              store.put(item);
            }
          });
        };
        tx.oncomplete = () => {
          showToast("同期が正常に完了しました", "success");
          updateSyncStatusUI();
        };
      } catch (err) {
        showToast("同期に失敗しました", "error");
      }
    }

    function executeSearch(targetEquipId = null) {
      const kw = document.getElementById('search-input').value.toLowerCase();
      const tx = db.transaction(["procedures"], "readonly");
      const store = tx.objectStore("procedures");
      const req = store.getAll();

      req.onsuccess = () => {
        let results = req.result;
        if (targetEquipId) {
          results = results.filter(doc => doc.equipId === targetEquipId);
        } else if (kw) {
          results = results.filter(doc => 
            doc.title.toLowerCase().includes(kw) ||
            (doc.equipId && doc.equipId.toLowerCase().includes(kw)) ||
            (doc.steps && doc.steps.some(s => s.desc.toLowerCase().includes(kw)))
          );
        }

        const container = document.getElementById('search-results');
        container.innerHTML = results.map(doc => `
          <div style="padding:16px; border-bottom:1px solid #eee; cursor:pointer;" onclick="viewDetail(${doc.id})">
            <div style="font-size:1.1rem; font-weight:bold; color:var(--primary);">${doc.title}</div>
            <div style="font-size:0.85rem; color:#666;">設備ID: ${doc.equipId || 'なし'} | ステータス: ${doc.status}</div>
          </div>
        `).join('');
      };
    }

    function viewDetail(id) {
      const tx = db.transaction(["procedures"], "readonly");
      const store = tx.objectStore("procedures");
      const req = store.get(id);

      req.onsuccess = () => {
        const doc = req.result;
        document.getElementById('view-title').textContent = doc.title;
        document.getElementById('view-equip').textContent = doc.equipId || 'なし';

        const body = document.getElementById('view-steps-body');
        body.innerHTML = '';

        if (doc.steps) {
          doc.steps.forEach(s => {
            body.innerHTML += `
              <div class="a4-step">
                <div class="a4-step-num">手順 ${s.stepNum}</div>
                <div class="a4-step-text">${s.desc || ''}</div>
                ${s.imgData ? `<img src="${s.imgData}" class="a4-step-img">` : ''}
              </div>
            `;
          });
        }
        openPanel('view-panel');
      };
    }

    /* 6. QRスキャナー & PWA */
    let videoStream = null;

    function openQRScanner() {
      openPanel('qr-panel');
      const video = document.getElementById('qr-video');

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
        videoStream = stream;
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        requestAnimationFrame(scanQRCode);
      }).catch(() => {
        showToast("カメラの起動に失敗しました", "error");
        closePanel();
      });
    }

    function scanQRCode() {
      const video = document.getElementById('qr-video');
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const cvs = document.createElement("canvas");
        cvs.width = video.videoWidth;
        cvs.height = video.videoHeight;
        const ctx = cvs.getContext("2d");
        ctx.drawImage(video, 0, 0, cvs.width, cvs.height);
        const imgData = ctx.getImageData(0, 0, cvs.width, cvs.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height);

        if (code) {
          stopQRScanner();
          showToast(`設備ID検出: ${code.data}`, "success");
          openPanel('search-panel');
          executeSearch(code.data);
          return;
        }
      }
      if (document.getElementById('qr-panel').style.display === 'block') {
        requestAnimationFrame(scanQRCode);
      }
    }

    function stopQRScanner() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
    }

    async function checkStorageQuota() {
      if (navigator.storage && navigator.storage.estimate) {
        const estimate = await navigator.storage.estimate();
        const availableMB = (estimate.quota - estimate.usage) / (1024 * 1024);
        if (availableMB < 100) {
          document.getElementById('storage-alert').style.display = 'block';
        }
      }
    }

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'proc-v2';
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./'])));
        });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob));
    }
  </script>
</body>
